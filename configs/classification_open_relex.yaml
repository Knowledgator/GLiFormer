model:
  model_name: microsoft/deberta-v3-small
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1

  ner_config: null
  joint_relex_config: null
  structuring_config: null
  count_config: null
  embedding_config: null

  classification_config:
    # Scorer type: "dot", "weighted-dot", "mlp"
    layer_type: "dot"
    # Text pooling strategy: "mean", "cls", "max"
    pooling_type: "mean"
    loss_coef: 1.0
    focal_loss_alpha: null
    focal_loss_gamma: null
    focal_loss_prob_margin: null

  open_relex_config:
    # Anchor acquisition strategy:
    #   "fixed"             — learnable embedding table with num_slots anchors
    #   "rotary" / "rnn"    — rotary position-conditioned anchors via RotaryGroupRNN
    #   "query_rnn"         — similarity-based token selection + GRU (uses word embeddings)
    #   "query_transformer" — similarity-based token selection + Transformer (uses word embeddings)
    anchor_layer:
      type: "fixed"
      params:
        num_slots: 10
    anchor_normalization: "none"
    # Anchor-child fusion strategy:
    #   "linear" — linear projection of concatenated anchor + child (default)
    #   "rnn"    — GRU-based recurrent processing (GLiNER2-style)
    #   "mlp"    — multi-layer perceptron fusion
    anchor_modeling: "linear"
    loss_coef: 1.0
    focal_loss_alpha: null
    focal_loss_gamma: null
    focal_loss_prob_margin: null
    # Whether to learn span-level representations (adds span-level scoring path alongside token-level BIO)
    represent_spans: false
    # Negative span sampling ratio (only used when represent_spans=true)
    # neg_spans_ratio: 1.0
    # Loss coefficient for span representation loss (only used when represent_spans=true)
    # span_loss_coef: 1.0
    # Optional refinement core:
    # anchor_refinement:
    #   type: "cross_attention"
    #   params: {num_layers: 2, num_heads: 8, norm_style: "pre_norm"}
    anchor_refinement: "none"

data:
  root_dir: logs/classification_open_relex
  train_data: "data/classification_open_relex_train.json"
  val_data: "none"

training:
  prev_path: null                 # path to a GLiNExT checkpoint to init from (null = from scratch)
  num_steps: 20000
  train_batch_size: 4
  gradient_accumulation_steps: 1
  eval_every: 1000
  warmup_ratio: 0.05
  scheduler_type: "cosine"
  focal_loss_alpha: 0.75
  focal_loss_gamma: 0
  loss_reduction: "sum"
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  save_total_limit: 3
  train_head_only: false
  bf16: true
