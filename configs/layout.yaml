model:
  model_variant: layout
  use_layout: true
  model_name: microsoft/layoutlmv3-base
  labels_encoder: null
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1

  image_size: 224
  vision_processor_type: custom
  vision_resize_size: 224
  vision_center_crop_size: null
  vision_interpolation: bilinear
  vision_do_rescale: true
  vision_do_normalize: true

  ner_config:
    loss_coef: 1.0
    focal_loss_alpha: null
    focal_loss_gamma: null
    focal_loss_prob_margin: null
    represent_spans: false

  structuring_config:
    anchor_mode: "fixed"
    anchor_modeling: "linear"
    anchor_num_heads: 4
    anchor_num_layers: 2
    max_count: 20
    num_fixed_slots: 20
    loss_coef: 1.0
    focal_loss_alpha: null
    focal_loss_gamma: null
    focal_loss_prob_margin: null
    represent_spans: false
    use_anchor_matching: true
    anchor_objectness: true
    anchor_objectness_loss_coef: 0.5
    anchor_objectness_threshold: 0.5

  classification_config: null
  joint_relex_config: null
  open_relex_config: null
  count_config: null
  embedding_config: null

data:
  root_dir: logs/layout
  train_data: "data/layout_train.json"
  val_data: "none"

training:
  prev_path: null
  num_steps: 30000
  train_batch_size: 2
  gradient_accumulation_steps: 2
  eval_every: 1000
  warmup_ratio: 0.05
  scheduler_type: "cosine"
  focal_loss_alpha: 0.75
  focal_loss_gamma: 0
  focal_loss_prob_margin: 0
  loss_reduction: "sum"
  negatives: 1.0
  masking: "none"
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  save_total_limit: 3
  train_head_only: false
  freeze_components: null
  bf16: true
  compile_model: false
