model:
  model_name: microsoft/deberta-v3-base
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  max_types: 100
  max_len: 1024
  max_neg_type_ratio: 1

  ner_config: null

  structuring_config:
    # Enable for data/structuring_multi_level.jsonl. Nested dictionaries are
    # dot-qualified; dictionaries inside lists receive their own record anchor.
    # Raise num_slots for full coverage (that dataset contains up to 149
    # anchors in one schema; the 10-slot experiment below intentionally does not).
    multi_level: false
    anchor_relations_layer: "mlp"
    anchor_relations_loss_coef: 1.0
    anchor_relations_threshold: 0.5
    # Anchor acquisition modes:
    #   parent                  - one anchor from the parent/schema token
    #   features                - every valid word feature is an anchor
    #   fixed                   - learned fixed slots conditioned on the parent
    #   fixed_rnn               - learned fixed slots decoded by a GRU
    #   fixed_transformer       - learned fixed slots decoded by cross-attention
    #   rnn / rotary            - count-driven rotary GRU anchors
    #   query_rnn               - parent-similar word features refined by a GRU
    #   query_transformer       - parent-similar features refined by attention
    # Parameter-free fixed-width word-feature modes (configure num_slots):
    #   position_buckets        - mean of equal relative-position text regions
    #   topk_norm               - word features with the largest L2 magnitude
    #   topk_distinct           - greedily selected cosine-distinct features
    #   topk_parent             - features most cosine-similar to the parent
    #   topk_density_distinct   - dense representatives kept mutually distinct
    anchor_layer:
      type: "position_buckets"
      params:
        num_slots: 10
    # Remove the document-wide component that otherwise makes contextual
    # bucket means nearly collinear, then restore each local residual's scale.
    anchor_normalization: "center_rms"
    anchor_modeling: "mlp"
    # Refine anchors against valid word features before field/span scoring.
    # Position tensors are re-added to Q/K (and optionally memory V) in every
    # refinement layer. Available parameter-free 1D modes include:
    #   fixed_sinusoidal - standard fixed Transformer sine/cosine features
    #   fourier          - fixed log-spaced multi-frequency Fourier features
    # Set memory/query independently to "none" for an ablation.
    anchor_refinement:
      type: "cross_attention"
      params:
        num_layers: 2
        num_heads: 8
        norm_style: "pre_norm"
        layer_scale_init: 0.1
    # Start each slot's cross-attention near its own bucket. Sigma is measured
    # in bucket widths; 0.5 strongly prefers the local region but stays soft.
    anchor_cross_attention_bias:
      type: "gaussian_distance"
      params:
        sigma: 0.5
        weight: 1.0
        units: "query_steps"
        # Optional; all three default to false, preserving a fixed bias.
        # learnable_sigma: true
        # learnable_weight: true
        # per_head: true
    # For fixed-width anchors, fixed_sinusoidal automatically sets the shared
    # max_position to anchor_layer.params.num_slots (10 here).
    anchor_memory_position:
      type: "fourier"
      params: {}
    anchor_query_position:
      type: "fourier"
      params: {}
    # Both modes have useful parameter-free defaults. Optional kwargs:
    #   fourier: {min_frequency: 1.0, max_frequency: 64.0,
    #             frequency_spacing: "log"}
    #   fixed_sinusoidal: {max_position: 10.0, temperature: 10000.0}
    # Keep the attended token location in the refined anchor representation.
    anchor_memory_position_usage: "keys_and_values"
    loss_coef: 1.0
    focal_loss_alpha: 0.75
    focal_loss_gamma: 2.0
    focal_loss_prob_margin: null
    represent_spans: false
    use_anchor_matching: true
    # Normalise BIO loss by the valid-mask volume so gradient magnitude
    # is decoupled from anchor count and sequence length.
    bio_loss_reduction: "mean"
    # BIO positives occupy roughly 0.2-0.5% of valid cells in this dataset.
    # Keep all positives and deterministically down-weight every negative; the
    # loss mean is normalized by effective weights, not raw negative volume.
    negatives: 1.0
    masking: "none"
    # Per-anchor "is this slot used?" head. Filters empty anchors at
    # inference and adds explicit objectness supervision during training.
    anchor_objectness: true
    anchor_objectness_loss_coef: 0.001
    anchor_objectness_threshold: 0.5
    # Diagnostic: log positive vs negative loss split every N steps.
    log_loss_stats: true
    log_loss_stats_every: 50

  classification_config: null
  joint_relex_config: null
  open_relex_config: null
  count_config: null

  embedding_config: null

data:
  root_dir: logs/structuring_position_buckets_balanced
  train_data: "data/structuring_synthetic.cleaned.jsonl"
  val_data: "none"

training:
  # Continue from the diverse 10k-step bucket representations while replacing
  # the degenerate sparse loss and matching policy from the active YAML.
  prev_path: null
  num_steps: 12000
  train_batch_size: 1
  gradient_accumulation_steps: 4
  eval_every: 3000
  warmup_ratio: 0.01
  scheduler_type: "cosine"
  focal_loss_alpha: 0.9
  focal_loss_gamma: 2
  loss_reduction: "sum"
  lr_encoder: 3e-5
  lr_others: 5e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  save_total_limit: 3
  train_head_only: false
  bf16: true
