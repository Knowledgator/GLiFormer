model:
  model_name: microsoft/deberta-v3-small
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1
  default_ner_config: false

  ner_config: null

  open_relex_config:
    anchor_layer:
      type: "fixed_rnn"
      params:
        num_slots: 30
    anchor_normalization: "none"
    anchor_modeling: "linear"
    # Let instance slots specialize against the current document instead of
    # deriving every query from the schema embedding alone.
    anchor_refinement:
      type: "cross_attention"
      params:
        num_layers: 2
        num_heads: 8
        norm_style: "pre_norm"
        layer_scale_init: 0.1
    loss_coef: 1.0
    # Endpoint BIO targets are extremely sparse. BCE (gamma=0) collapses to
    # an almost constant background probability on this dataset.
    focal_loss_alpha: 0.75
    focal_loss_gamma: 2.0
    focal_loss_prob_margin: 0.0
    represent_spans: false

  classification_config: null
  joint_relex_config: null
  structuring_config: null
  count_config: null
  embedding_config: null

data:
  # Keep the corrected from-scratch run separate from collapsed legacy
  # checkpoints; demo.py otherwise selects the numerically highest old step.
  root_dir: logs/open_relex_v2
  train_data: "data_prod/relex_150k.jsonl"
  val_data: "none"

training:
  prev_path: null                 # path to a GLiNExT checkpoint to init from (null = from scratch)
  num_steps: 100000
  train_batch_size: 4
  gradient_accumulation_steps: 1
  eval_every: 500
  warmup_ratio: 0.05
  scheduler_type: "cosine"
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2.0
  loss_reduction: "sum"
  # Retain every positive cell while sampling dense token/slot negatives.
  # Unused relation slots still receive background supervision.
  negatives: 0.01
  masking: "global"
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  save_total_limit: 3
  train_head_only: false
  bf16: true
