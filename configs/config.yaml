model:
  # Backbone encoder
  model_name: microsoft/deberta-v3-small
  labels_encoder: null  # Set to model name for bi-encoder architecture
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  fuse_layers: false
  post_fusion_schema: null
  span_mode: markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1

  # ── Task heads (set to null to disable) ──

  ner_config:
    loss_coef: 1.0
    focal_loss_alpha: null        # null = use training.focal_loss_alpha
    focal_loss_gamma: null        # null = use training.focal_loss_gamma
    focal_loss_prob_margin: null  # null = use training.focal_loss_prob_margin
    # Independent anchor components. A component can be a strategy name or a
    # strict {type, params} mapping.
    anchor_layer: "parent"
    anchor_normalization: "none"
    anchor_modeling: "linear"
    anchor_refinement: "none"
    represent_spans: false
    neg_spans_ratio: 1.0
    span_loss_coef: 1.0

  classification_config: null
  # classification_config:
  #   layer_type: "dot"           # "dot", "weighted-dot", "mlp"
  #   pooling_type: "mean"        # "mean", "cls", "max"
  #   cat_token_index: -1
  #   embed_cat_token: true
  #   loss_coef: 1.0
  #   focal_loss_alpha: null
  #   focal_loss_gamma: null
  #   focal_loss_prob_margin: null

  joint_relex_config: null
  # joint_relex_config:
  #   layer_type: "dot"           # "dot", "mlp", "attention", "bilinear", "gcn", "gat"
  #   pair_rep_type: "concat_proj"  # "concat_proj", "bilinear", "additive", "mlp"
  #   triples_layer: null
  #   embed_rel_token: true
  #   rel_token_index: -1
  #   loss_coef: 1.0
  #   adjacency_loss_coef: 1.0
  #   max_relation_span_width: null  # null disables inclusive-width filtering
  #   relation_span_nms: false       # greedily keep flat, non-overlapping spans
  #   max_relation_entities: null    # rank and cap entities by NER confidence
  #   relation_top_k_neighbors: null # dot mode only; avoids predicted dense E x E adjacency
  #   relation_neighbor_chunk_size: 64
  #   focal_loss_alpha: null
  #   focal_loss_gamma: null
  #   focal_loss_prob_margin: null

  open_relex_config: null
  # open_relex_config:
  #   anchor_layer:
  #     type: "fixed"
  #     params: {num_slots: 10}
  #   anchor_normalization: "none"
  #   anchor_modeling: "linear"
  #   anchor_refinement: "none"
  #   rel_token_index: -1
  #   embed_rel_token: true
  #   loss_coef: 1.0
  #   focal_loss_alpha: null
  #   focal_loss_gamma: null
  #   focal_loss_prob_margin: null
  #   represent_spans: false
  #   neg_spans_ratio: 1.0
  #   span_loss_coef: 1.0

  structuring_config: null
  # structuring_config:
  #   anchor_layer:
  #     type: "rotary"
  #     params: {max_count: 20}
  #   anchor_normalization: "none"
  #   anchor_modeling: "linear"
  #   anchor_refinement: "none"
  #   max_count: 20
  #   child_token_index: -1
  #   embed_child_token: true
  #   loss_coef: 1.0
  #   focal_loss_alpha: null
  #   focal_loss_gamma: null
  #   focal_loss_prob_margin: null
  #   represent_spans: false
  #   neg_spans_ratio: 1.0
  #   span_loss_coef: 1.0
  #   use_anchor_matching: true   # Hungarian-matched permutation-invariant BIO/span loss

  count_config: null
  # count_config:
  #   mode: "regression"          # "regression", "classification"
  #   max_count: 20
  #   loss_coef: 1.0

  embedding_config: null
  # embedding_config:
  #   pooling_type: "mean"        # "mean", "cls", "max", "weighted"
  #   similarity_fn: "cosine"     # "cosine", "dot", "l2"
  #   loss_fn: "mse"              # "mse", "contrastive", "triplet"
  #   projection_dim: null        # optional output dimension for embedding projections
  #   loss_coef: 1.0

data:
  root_dir: glinext_logs
  train_data: "data/train.json"
  val_data: "none"                # Set to path or "none"

training:
  # Pretrained model path (null = train from scratch)
  prev_path: null

  # Training schedule
  num_steps: 15000
  train_batch_size: 2
  gradient_accumulation_steps: 1
  eval_every: 500
  warmup_ratio: 0.05
  scheduler_type: "cosine"        # linear, cosine, constant

  # Loss
  focal_loss_alpha: 0.75
  focal_loss_gamma: 0
  focal_loss_prob_margin: 0
  loss_reduction: "sum"
  negatives: 1.0
  masking: "none"

  # Learning rates
  lr_encoder: 1e-5
  lr_others: 3e-5
  weight_decay_encoder: 0.1
  weight_decay_other: 0.01
  max_grad_norm: 10.0

  # Checkpointing
  save_total_limit: 3

  # Freezing
  train_head_only: false          # true = train only head-specific parameters
  freeze_components: null         # e.g. ["text_encoder"] or ["text_encoder", "ner"]

  # Precision
  bf16: true

  # Compilation
  compile_model: false
