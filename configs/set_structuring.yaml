model:
  model_name: microsoft/deberta-v3-base
  name: "glinext"
  max_width: 12
  hidden_size: 768
  dropout: 0.3
  fine_tune: true
  subtoken_pooling: first
  span_mode: markerV0
  max_types: 100
  max_len: 512
  max_neg_type_ratio: 1

  ner_config: null
  default_ner_config: false
  classification_config: null
  joint_relex_config: null
  open_relex_config: null
  structuring_config: null

  # Composite NER-first set structuring: classical field-aware NER extracts
  # entities, then pooled entity spans are classified into record anchors.
  set_structuring_config:
    head_type: "set_structuring"
    # Enable for data/structuring_multi_level.jsonl. The same record anchors
    # used by span membership are linked with directed parent-child scores.
    # Raise num_slots for full coverage (the dataset maximum is 149 anchors).
    multi_level: false
    anchor_relations_layer: "mlp"
    anchor_relations_loss_coef: 1.0
    anchor_relations_threshold: 0.5

    # Stage 1: parent + field prompts drive the internal NER extractor.
    # Record-anchor components below are isolated from this internal stage.
    anchor_modeling: "linear"
    entity_loss_coef: 1.0
    # Stage 2 receives target entities, as in joint relation extraction;
    # non-entity negatives are already learned by the token-level NER loss.
    neg_spans_ratio: 0.0

    # Stage 2: refined record queries score membership for every extracted
    # entity. Field identity remains the decision of the NER stage.
    anchor_layer:
      type: "position_buckets"
      params:
        num_slots: 32
        
    anchor_normalization: "none"
    # Match the regular structuring head's positional cross-attention setup.
    # The fixed record queries remain the initial record representations; this
    # refinement then attends them to the document with the same locality bias
    # and position representations used by configs/structuring.yaml.
    anchor_refinement:
      type: "cross_attention"
      params:
        num_layers: 2
        num_heads: 8
        norm_style: "pre_norm"
        layer_scale_init: 0.1
    anchor_cross_attention_bias:
      type: "gaussian_distance"
      params:
        sigma: 0.5
        weight: 1.0
        units: "query_steps"
    anchor_memory_position:
      type: "fourier"
      params: {}
    anchor_query_position:
      type: "fourier"
      params: {}
    anchor_memory_position_usage: "keys_and_values"
    # Match the largest synthetic-data count bucket; smaller capacities would
    # leave some gold records without a record query.
    max_count: 32
    span_loss_coef: 1.0  # entity-to-record assignment loss
    bio_loss_reduction: "mean"

    # Coefficient applied to the complete two-stage head by the orchestrator.
    loss_coef: 1.0
    focal_loss_alpha: 0.75
    focal_loss_gamma: 2.0

    # Suppress unused record slots during decoding.
    anchor_objectness: true
    anchor_objectness_loss_coef: 0.5
    anchor_objectness_threshold: 0.5

  count_config: null
  embedding_config: null

data:
  root_dir: logs/set_structuring
  train_data: "data/structuring_synthetic.cleaned.jsonl"
  val_data: "none"

training:
  prev_path: null
  num_steps: 200000
  train_batch_size: 1
  gradient_accumulation_steps: 4
  eval_every: 1000
  warmup_ratio: 0.05
  scheduler_type: "cosine"
  focal_loss_alpha: 0.75
  focal_loss_gamma: 2
  loss_reduction: "sum"
  lr_encoder: 3e-5
  lr_others: 5e-5
  weight_decay_encoder: 0.01
  weight_decay_other: 0.01
  max_grad_norm: 10.0
  save_total_limit: 3
  train_head_only: false
  bf16: true
